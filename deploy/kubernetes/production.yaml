apiVersion: v1
kind: Namespace
metadata:
  name: oblikovati
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website-org
  namespace: oblikovati
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: website-org
  template:
    metadata:
      labels:
        app.kubernetes.io/name: website-org
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: ghcr.io/oblikovati/website-oblikovati.org:placeholder
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: website-org
  namespace: oblikovati
spec:
  selector:
    app.kubernetes.io/name: website-org
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: website-org
  namespace: oblikovati
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: oblikovati.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: website-org
                port:
                  name: http
    - host: www.oblikovati.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: website-org
                port:
                  name: http
  tls:
    - hosts: [oblikovati.org, www.oblikovati.org]
      secretName: website-org-tls
